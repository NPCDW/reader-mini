[package]
name = "reader-mini"
version = "0.1.0"
edition = "2024"
description = "A minimal desktop reader built with Rust + Slint"

[dependencies]
slint = { version = "1.8", features = ["raw-window-handle-06"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
directories = "6.0.0"
global-hotkey = "0.8.0"
anyhow = "1"
once_cell = "1"
mouse_position = "0.1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[dev-dependencies]
i-slint-backend-testing = "1.8"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
