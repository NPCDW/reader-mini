<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reader-mini-reader</title>
    <style>
      /* 与 Config::default() 的 read_bg 一致。阅读底色是配置里读的，要等 JS 起来
         才写得上；这一条先顶住首帧，窗口才不会先白一下再暗下来 */
      html,
      body {
        margin: 0;
        background: #181818;
        color-scheme: dark;
      }

      /* webview 从无到有、Vue 还没挂载上的那一会儿：先顶一个「加载中」，
         别让读者看见一片空白。Vue 挂载时会清空 #reader，它自己就没了 */
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 100%;
        font:
          13px/1.5 "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          sans-serif;
        color: #bdbdbd;
        opacity: 0.65;
      }

      .boot .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="reader-body">
    <div id="reader">
      <div class="boot">
        <span class="spinner"></span>
        <span>加载中…</span>
      </div>
    </div>
    <script type="module" src="/src/reader.js"></script>
  </body>
</html>
