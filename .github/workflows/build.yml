name: Build

on:
  push:
    tags: "*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Nodejs
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy, rustfmt
        cache: false
    - name: Install web dependencies
      shell: bash
      run: |
        npm install -g pnpm
        pnpm i
    - name: install dependencies (ubuntu only)
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Frontend unit tests
      run: pnpm test
    - name: Frontend build
      run: pnpm build
    - name: Rust format
      working-directory: src-tauri
      run: cargo fmt --check
    - name: Rust lints
      working-directory: src-tauri
      run: cargo clippy --all-targets -- -D warnings
    - name: Rust tests
      working-directory: src-tauri
      run: cargo test
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x86
            platform: ubuntu-latest
            rust_target: ''
            tauri_build_args: ''
          - build: linux-arm
            platform: ubuntu-24.04-arm
            rust_target: ''
            tauri_build_args: ''
          # - build: macos-arm
          #   platform: macos-latest # for Arm based macs (M1 and above).
          #   rust_target: 'aarch64-apple-darwin'
          #   tauri_build_args: '--target aarch64-apple-darwin'
          # - build: macos-x86
          #   platform: macos-latest # for Intel based macs.
          #   rust_target: 'x86_64-apple-darwin'
          #   tauri_build_args: '--target x86_64-apple-darwin'
          - build: windows-x86
            platform: windows-latest
            rust_target: ''
            tauri_build_args: ''
          # - build: windows-arm
          #   platform: windows-11-arm
          #   rust_target: ''
          #   tauri_build_args: ''
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v6
    - name: Install Nodejs
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
        target: ${{ matrix.rust_target }}
    - name: Install web dependencies
      shell: bash
      run: npm install -g pnpm && pnpm i
    - name: install dependencies (ubuntu only)
      if: matrix.build == 'linux-x86' || matrix.build == 'linux-arm'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Build release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        projectPath: src-tauri
        updaterJsonPreferNsis: true
        tagName: ${{ github.ref_name }}
        assetNamePattern: "[name]-[version]-[platform]-[arch][ext]"
        args: ${{ matrix.tauri_build_args }}
